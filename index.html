<title>Meine Fußball-Weltrangliste</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);padding:14px 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:24px;margin:0 0 10px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.search{width:100%;border:0;background:#eef0f3;border-radius:12px;padding:11px 13px;font-size:16px;outline:none}
.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0 2px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:600}.tab.active{background:#111827;color:white;border-color:#111827}
main{max-width:760px;margin:auto;padding:10px 10px 90px}.row{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:7px 0;padding:10px 9px;touch-action:none}
.rank{width:35px;text-align:center;font-weight:800;color:#6b7280}.flag{font-size:25px;width:34px;text-align:center}.name{flex:1;min-width:0}.name b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:2px}.badge{font-size:10px;font-weight:800;border-radius:7px;padding:5px 6px;background:#eef0f3}.grip{color:#9ca3af;font-size:18px;padding:3px}.row.drag{opacity:.45}.row.over{outline:2px solid #111827}
.actions{position:fixed;bottom:16px;right:16px;z-index:10;display:flex;gap:8px}.fab{border:0;border-radius:999px;background:#111827;color:#fff;padding:13px 16px;font-weight:800;box-shadow:0 8px 25px #0003}.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:20}.sheet{background:white;width:100%;border-radius:22px 22px 0 0;padding:20px;max-height:85vh;overflow:auto}.sheet h2{margin-top:0}.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:16px;margin:6px 0 12px}.sheet button{border:0;border-radius:11px;padding:12px 15px;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#eef0f3}.confgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.conf{padding:14px;border:1px solid var(--line);border-radius:14px;background:white;text-align:left}.conf strong{display:block}.conf small{color:var(--muted)}
</style>
</head>
<body>
<header>
<h1>⚽ Meine Weltrangliste</h1>
<div class="sub"><span id="count"></span> Mannschaften · Drag & Drop zum Verschieben</div>

<div class="tabs" id="tabs"></div>
</header>
<main id="list"></main>
<div class="actions"><button class="fab" onclick="openAdd()">＋ Mannschaft</button></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">
<h2 id="modalTitle">Mannschaft hinzufügen</h2>
<label>Name</label><input id="mName" placeholder="z. B. Deutschland">
<label>FIFA-/Kurzcode</label><input id="mCode" placeholder="GER">
<label>Verband</label><select id="mConf"></select>
<label>Flagge</label><input id="mFlag" placeholder="🇩🇪">
<div style="display:flex;gap:8px"><button class="primary" onclick="saveTeam()">Speichern</button><button class="secondary" onclick="closeModal()">Abbrechen</button></div>
</div></div>

}
