.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:20}.sheet{background:white;width:100%;border-radius:22px 22px 0 0;padding:20px;max-height:85vh;overflow:auto}.sheet h2{margin-top:0}.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:16px;margin:6px 0 12px}.sheet button{border:0;border-radius:11px;padding:12px 15px;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#eef0f3}.confgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.conf{padding:14px;border:1px solid var(--line);border-radius:14px;background:white;text-align:left}.conf strong{display:block}.conf small{color:var(--muted)}.movebox{display:flex;gap:8px;margin:2px 0 14px}.movebox button{flex:1;background:#eef0f3}.danger{background:#fee2e2;color:#991b1b;margin-left:auto}
 .calcSearchResults{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:-7px 0 12px}.calcOption{display:block;width:100%;text-align:left;background:white;border:0;border-bottom:1px solid var(--line);padding:10px}.calcOption.selected{background:#e5e7eb;font-weight:800}.archiveMonths{display:flex;gap:6px;overflow:auto;padding:6px 0}.archiveMonths button{white-space:nowrap}.archiveTitle{font-size:12px;color:var(--muted);padding-top:5px}.backupBtns{display:flex;gap:7px;flex-wrap:wrap}.backupBtns button{font-size:12px}
.archiveActions{display:flex;justify-content:flex-end;padding:3px 0}.deleteYearBtn{border:1px solid #fecaca;background:#fff1f2;color:#991b1b;border-radius:9px;padding:7px 11px;font-weight:700;font-size:12px}

.rankArrow{width:12px;height:15px;object-fit:contain;flex-shrink:0}
/* Entwurfsgetreue Ranglisten- und Detailansicht */
:root{--blue:#075d9b}
header{position:relative;padding:14px 14px 12px} .search{border-radius:18px;background:#eef0f3;padding:14px}
.yearbtn{border-radius:13px;color:#0784e8;padding:9px 14px}.yearbtn.active{color:white}
.tab{border-radius:999px;color:#0784e8;padding:10px 14px}.tab.active{color:white}
.settingsBtn{flex:1;min-width:0;color:#0784e8;font-size:13px;padding:12px 7px;border-radius:13px}
.backupBtns button{font-size:12px}main{padding:8px 9px 90px}
.teamWrap{margin:0;border:0;border-bottom:2px solid #bfc0c2;border-radius:0;overflow:hidden;background:white}
.teamWrap:first-child{border-top:2px solid #bfc0c2}
main#list{padding:0 0 90px;max-width:760px}
.teamWrap .row{border-radius:0}
.row{margin:0;border:0;border-radius:0;gap:8px;min-height:66px;padding:10px 9px;touch-action:auto}
.rank{width:34px;color:#111;font-size:19px}.trend{width:48px;flex:0 0 48px;font-size:13px}
.flag{width:39px;flex:0 0 39px;font-size:27px;display:flex;align-items:center;justify-content:center}
.flag img{width:36px;height:25px;object-fit:contain;border-radius:0}
.name b{font-size:17px}.name .meta{display:none}.points{font-size:18px;min-width:76px}
.expandBtn{border:0;background:transparent;color:#b9b9b9;font-size:23px;padding:6px 2px;cursor:pointer}
.teamDetails{border-top:1px solid #ddd;padding:15px 12px 20px;background:white}
.detailTitle{font-size:20px;font-weight:800;text-align:center;border:2px solid #c3c3c3;border-radius:14px;padding:5px;margin:0 0 9px}
.matchGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.matchCard{border:2px solid #c2c2c2;border-radius:13px;overflow:hidden;font-size:12px}
.matchHeading{background:#075d9b;color:#fff;padding:6px 7px;font-size:10px;min-height:30px;font-weight:700}
.matchTeam{display:grid;grid-template-columns:24px minmax(0,1fr) 22px;align-items:center;gap:5px;padding:5px 6px;font-weight:650}
.matchTeam .flag{width:24px;font-size:17px}.matchTeam .flag img{width:23px;height:16px}
.matchTeam span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{background:#bbb;color:#fff;border-radius:4px;text-align:center;padding:3px}
.matchFoot{border-top:2px solid #c2c2c2;padding:6px 10px;display:flex;align-items:center;gap:13px}
.resultDot{border-radius:50%;background:#666;color:#fff;width:24px;height:24px;display:grid;place-items:center;font-weight:800}
.resultDot.W{background:#04c400}.resultDot.L{background:#d00000}
.detailGraphTitle{font-size:20px;font-weight:750;margin:32px 0 20px}
.graphTabs{display:flex;gap:7px;margin-bottom:15px}.graphTabs button{border:1px solid #e2e5ec;background:#fff;color:#536078;border-radius:999px;padding:9px 12px;font-weight:700;flex:1}
.graphTabs button.selected{background:#075d9b;color:white}.historyChart{width:100%;height:auto;display:block}
@media(min-width:650px){.matchGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

<body>
<header>
<h1>⚽ Meine Weltrangliste</h1>
<div class="sub"><span id="count"></span> Mannschaften · Rangfolge nach Punkten</div>
<input id="search" class="search" placeholder="🔎 Land suchen …">
<div class="yearbar" id="yearbar"></div>
<div id="monthbar" class="archiveMonths"></div><div id="archiveActions" class="archiveActions"></div><div class="tabs" id="tabs"></div>
<div style="display:flex;gap:7px">
<button class="settingsBtn" onclick="saveMonthSnapshot()">💾 Monat speichern</button>
<button class="settingsBtn" onclick="openConfSettings()">⚙️ Verbände</button>
<button class="settingsBtn" onclick="openCalc()">🧮 Spiel berechnen</button>
</div>
<div class="backupBtns"><button class="settingsBtn" onclick="exportBackup()">⬇️ Sicherung exportieren</button><button class="settingsBtn" onclick="document.getElementById('backupFile').click()">⬆️ Sicherung importieren</button><input type="file" id="backupFile" accept="application/json,.json" style="display:none" onchange="importBackup(this)"></div>
</header>
<main id="list"></main>
<div class="actions"><button class="fab" onclick="openAdd()">＋ Mannschaft</button></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">
<h2 id="modalTitle">Mannschaft hinzufügen</h2>
<label>Name</label><input id="mName" placeholder="z. B. Deutschland">
<label>FIFA-/Kurzcode</label><input id="mCode" placeholder="GER"><input id="mRank" type="hidden">
<label>Punkte</label><input id="mPoints" type="number" step="0.01" inputmode="decimal" placeholder="z. B. 1854.32">
<label>Verband</label><select id="mConf"></select>
<label>Flagge (Emoji)</label><input id="mFlag" placeholder="🇩🇪">
<label>oder Flaggenbild</label>
<input id="mFlagFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
<div id="flagImageInfo" class="sub"></div>
<div id="movebox" class="movebox" style="display:none">
<button onclick="moveEdited(-1)">▲ 1 Platz</button><button onclick="moveEdited(1)">▼ 1 Platz</button>
</div>
<div style="display:flex;gap:8px"><button class="primary" onclick="saveTeam()">Speichern</button><button class="secondary" onclick="closeModal()">Abbrechen</button><button id="deleteBtn" class="danger" style="display:none" onclick="deleteEdited()">Löschen</button></div>
</div></div>


<div id="calcModal" class="modal" onclick="if(event.target===this)closeCalc()"><div class="sheet">
<h2>🧮 Spiel berechnen</h2>
<label>Team A suchen</label><input id="calcSearchA" placeholder="Name oder Ländercode …" oninput="filterCalc('A')"><div id="calcChoicesA" class="calcSearchResults"></div><select id="calcA" onchange="calculateMatch()" style="display:none"></select>
<label>Team B suchen</label><input id="calcSearchB" placeholder="Name oder Ländercode …" oninput="filterCalc('B')"><div id="calcChoicesB" class="calcSearchResults"></div><select id="calcB" onchange="calculateMatch()" style="display:none"></select>
<label>Wettbewerb (frei beschreibbar)</label><input id="calcCompetition" placeholder="z. B. Afrika Cup of Nations 2078 – Halbfinale" maxlength="140"><label>Spielart / Gewichtung</label><select id="calcI" onchange="calculateMatch()">
<option value="5">5 – Freundschaftsspiel außerhalb int. Fenster</option><option value="10">10 – Freundschaftsspiel im int. Fenster</option><option value="15">15 – Nations League Gruppenspiel</option><option value="25">25 – Nations League K.o. / Qualifikation</option><option value="35">35 – Kontinentale Meisterschaft bis vor Viertelfinale</option><option value="40">40 – Confed Cup / kontinentale Meisterschaft ab Viertelfinale</option><option value="50">50 – WM bis einschließlich Achtelfinale</option><option value="60">60 – WM ab Viertelfinale</option>
</select>
<div style="display:flex;gap:10px"><div style="flex:1"><label>Tore Team A</label><input id="calcGoalsA" type="number" min="0" step="1" value="1" oninput="updateCalcOutcome()"></div><div style="flex:1"><label>Tore Team B</label><input id="calcGoalsB" type="number" min="0" step="1" value="0" oninput="updateCalcOutcome()"></div></div><div id="calcOutcomeInfo" class="sub" style="margin:0 0 10px"></div>
<div id="calcDrawOptions" style="display:none"><label>Entscheidung bei Gleichstand</label><select id="calcDecision" onchange="updateCalcOutcome()"><option value="draw">Unentschieden</option><option value="pens">Elfmeterschießen</option></select><div id="calcPenalties" style="display:none"><div style="display:flex;gap:10px"><div style="flex:1"><label>Elfmeter Team A</label><input id="calcPensA" type="number" min="0" step="1" value="5" oninput="updateCalcOutcome()"></div><div style="flex:1"><label>Elfmeter Team B</label><input id="calcPensB" type="number" min="0" step="1" value="4" oninput="updateCalcOutcome()"></div></div></div></div>
<label>Spielende</label><select id="calcExtraTime"><option value="">Reguläre Spielzeit</option><option value="extra">Nach Verlängerung</option></select><input id="calcResult" type="hidden" value="win">
<label style="display:flex;gap:10px;align-items:center;margin:4px 0 14px"><input id="calcFinalKO" type="checkbox" onchange="calculateMatch()" style="width:auto;margin:0"> K.-o.-Spiel eines Finalwettbewerbs (Schutz vor Punktverlust)</label>
<div id="calcResultBox" style="background:#f3f4f6;border-radius:14px;padding:14px;margin:8px 0 14px"></div>
<div style="display:flex;gap:8px"><button class="primary" onclick="applyMatchPoints()">Punkte übernehmen</button><button class="secondary" onclick="closeCalc()">Abbrechen</button></div>
</div></div>

<div id="confModal" class="modal" onclick="if(event.target===this)closeConfSettings()"><div class="sheet">
<h2>Verbände bearbeiten</h2>
<div class="sub">Hier kannst du Namen und Logos der Verbände ändern. Die Bilder werden nur auf diesem Gerät gespeichert.</div>
<div id="confLogoList"></div>
<div style="margin-top:14px"><button class="secondary" onclick="closeConfSettings()">Fertig</button></div>
</div></div>

const IMG_DB="rankingImagesV1", IMG_STORE="images";
function openImgDB(){return new Promise((res,rej)=>{let r=indexedDB.open(IMG_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(IMG_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putImage(key,file){let db=await openImgDB();return new Promise((res,rej)=>{let tx=db.transaction(IMG_STORE,"readwrite");tx.objectStore(IMG_STORE).put(file,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function getImage(key){let db=await openImgDB();return new Promise((res,rej)=>{let r=db.transaction(IMG_STORE).objectStore(IMG_STORE).get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function delImage(key){let db=await openImgDB();return new Promise((res,rej)=>{let tx=db.transaction(IMG_STORE,"readwrite");tx.objectStore(IMG_STORE).delete(key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}

const confImages={};
let confLabels=JSON.parse(localStorage.getItem("rankingConfLabels")||"{}");
let snapshots=JSON.parse(localStorage.getItem("rankingSnapshotsV1")||"{}");
let viewingYear=null;
function labelFor(c){return confLabels[c]||confs.find(x=>x[0]===c)?.[1]||c}
function currentYear(){return String(new Date().getFullYear())}
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONTH_KEY="rankingMonthlySnapshotsV1";
let monthlySnapshots=JSON.parse(localStorage.getItem(MONTH_KEY)||"{}");
let viewingMonth=null;
function sortedYears(){return [...new Set([...Object.keys(snapshots),...Object.keys(monthlySnapshots)])].sort((a,b)=>Number(b)-Number(a))}
function archiveEntries(){
 const result=[];
 for(const y of sortedYears()){
  if(snapshots[y]?.teams)result.push({year:y,month:null,snap:snapshots[y],order:Number(y)*12-1});
  for(const [m,snap] of Object.entries(monthlySnapshots[y]||{}))if(snap?.teams)result.push({year:y,month:m,snap,order:Number(y)*12+MONTHS.indexOf(m)});
 }
 return result.sort((a,b)=>b.order-a.order);
}
function previousSnapshot(){
 const entries=archiveEntries();
 const cutoff=viewingYear ? Number(viewingYear)*12+(viewingMonth===null? -1:MONTHS.indexOf(viewingMonth)) : Infinity;
 return entries.find(e=>e.order<cutoff)?.snap||null;
}

function trendFor(t,world){
 let prev=previousSnapshot();if(!prev)return "";
 let ordered=[...prev.teams].sort((a,b)=>pointsOf(b)-pointsOf(a));
 let i=ordered.findIndex(x=>x.id===t.id || (x.code===t.code&&x.name===t.name));if(i<0)return "";
 let d=i+1-world;
 return d>0?`<div class="trend up"><img class="rankArrow" src="${RANK_UP_IMAGE}" alt="Aufstieg">${d}</div>`:d<0?`<div class="trend down"><img class="rankArrow" src="${RANK_DOWN_IMAGE}" alt="Abstieg">${Math.abs(d)}</div>`:`<div class="trend same">●</div>`;
}
function renderYears(){
 const ys=sortedYears();
 yearbar.innerHTML=`<button class="yearbtn ${!viewingYear?'active':''}" onclick="viewLatest()">Aktuell</button>`+ys.map(y=>`<button class="yearbtn ${viewingYear===y?'active':''}" onclick="viewYear('${y}')">${y}</button>`).join("");
 const bar=document.getElementById('monthbar');
 document.getElementById('archiveActions').innerHTML=viewingYear?`<button class="deleteYearBtn" onclick="deleteArchiveYear()">Jahr ${viewingYear} löschen</button>`:'';
 if(!viewingYear){bar.innerHTML='';return}
 let legacy=snapshots[viewingYear];let months=Object.keys(monthlySnapshots[viewingYear]||{}).sort((a,b)=>MONTHS.indexOf(a)-MONTHS.indexOf(b));
 bar.innerHTML=(legacy?`<button class="yearbtn ${viewingMonth===null?'active':''}" onclick="viewArchive('${viewingYear}',null)">Alter Jahresstand</button>`:'')+
 months.map(m=>`<button class="yearbtn ${viewingMonth===m?'active':''}" onclick="viewArchive('${viewingYear}','${m}')">${m}</button>`).join('');
 if(!legacy&&!months.length)bar.innerHTML='<span class="archiveTitle">Noch kein Monat gespeichert</span>';
}
async function deleteArchiveYear(){
 const y=viewingYear;
 if(!y || !Object.prototype.hasOwnProperty.call(snapshots,y) && !Object.prototype.hasOwnProperty.call(monthlySnapshots,y))return;
 const monthCount=Object.keys(monthlySnapshots[y]||{}).length;
 const details=[snapshots[y]?.teams?'den bisherigen Jahresstand':null,monthCount?`${monthCount} Monatsstand${monthCount===1?'':'e'}`:null].filter(Boolean).join(' und ');
 if(!confirm(`Jahr ${y} wirklich löschen?\n\nDabei werden ${details} dauerhaft aus dem Archiv entfernt.\n\nDeine aktuelle Weltrangliste bleibt erhalten. Bitte sichere deine Daten vorher über „Sicherung exportieren“. `))return;
 if(!confirm(`Letzte Bestätigung: Alle Archivstände für ${y} endgültig löschen?`))return;
 const nextYears={...snapshots},nextMonths={...monthlySnapshots};
 delete nextYears[y];delete nextMonths[y];
 const oldYears=localStorage.getItem('rankingSnapshotsV1'),oldMonths=localStorage.getItem(MONTH_KEY);
 try{
  localStorage.setItem('rankingSnapshotsV1',JSON.stringify(nextYears));
  localStorage.setItem(MONTH_KEY,JSON.stringify(nextMonths));
 }catch(e){
  try{if(oldYears===null)localStorage.removeItem('rankingSnapshotsV1');else localStorage.setItem('rankingSnapshotsV1',oldYears);if(oldMonths===null)localStorage.removeItem(MONTH_KEY);else localStorage.setItem(MONTH_KEY,oldMonths)}catch(_){}
  alert('Löschen fehlgeschlagen: '+e.message);return;
 }
 snapshots=nextYears;monthlySnapshots=nextMonths;
 await viewLatest();alert(`Jahr ${y} wurde aus dem Archiv gelöscht.`);
}
async function viewArchive(y,m){
 viewingYear=y;viewingMonth=m;clearObjectUrls();
 const snap=m===null?snapshots[y]:monthlySnapshots[y]?.[m];
 if(snap?.teams)await hydrateSnapshotImages(snap.teams);
 render();
}
async function viewYear(y){let months=Object.keys(monthlySnapshots[y]||{}).sort((a,b)=>MONTHS.indexOf(b)-MONTHS.indexOf(a));await viewArchive(y,months[0]||null)}
async function viewLatest(){viewingYear=null;viewingMonth=null;await hydrateImages();render()}
function displayTeams(){return viewingYear ? (viewingMonth===null?snapshots[viewingYear]?.teams:monthlySnapshots[viewingYear]?.[viewingMonth]?.teams)||[] : teams}
function saveMonthSnapshot(){
 let y=prompt('Jahr für den neuen Monatsstand (z. B. 2073):',viewingYear||currentYear());if(y===null)return;
 y=String(y).trim();if(!/^\d{4}$/.test(y)){alert('Bitte ein vierstelliges Jahr eingeben.');return}
 let choice=prompt('Monat eingeben (z. B. Januar oder März):','Januar');if(choice===null)return;
 let m=MONTHS.find(x=>x.toLocaleLowerCase('de')===choice.trim().toLocaleLowerCase('de')||x.slice(0,3).toLocaleLowerCase('de')===choice.trim().toLocaleLowerCase('de'));
 if(!m){alert('Bitte einen Monatsnamen von Januar bis Dezember eingeben.');return}
 if(monthlySnapshots[y]?.[m]&&!confirm(`${m} ${y} ist bereits gespeichert. Wirklich überschreiben?`))return;
 const next=JSON.parse(JSON.stringify(monthlySnapshots));
 if(!next[y])next[y]={};
 next[y][m]={year:y,month:m,savedAt:new Date().toISOString(),teams:[...teams].sort((a,b)=>pointsOf(b)-pointsOf(a)).map(({_img,...t})=>({...t}))};
 try{localStorage.setItem(MONTH_KEY,JSON.stringify(next));monthlySnapshots=next;render();alert(`${m} ${y} gespeichert. Die aktuelle Rangliste bleibt unverändert.`)}catch(e){alert('Speichern fehlgeschlagen: '+e.message)}
}

   grip.addEventListener("pointermove",e=>{
     if(!dragState||dragState.pointerId!==e.pointerId)return;e.preventDefault();
     let el=document.elementFromPoint(e.clientX,e.clientY),target=el?.closest?.(".row");
     if(!target||target.dataset.id===dragState.id)return;
     let r=target.getBoundingClientRect(),after=e.clientY>r.top+r.height/2,key=target.dataset.id+":"+after;
     if(key===dragState.last)return;dragState.last=key;
     moveTeam(dragState.id,target.dataset.id,after);render();
     let ng=[...document.querySelectorAll(".grip")].find(x=>x.dataset.grip===dragState.id);
     if(ng){dragState.row=ng.closest(".row");dragState.row.classList.add("dragging")}
   });
   let finish=()=>{if(dragState){dragState.row?.classList.remove("dragging");dragState=null;render()}};
   grip.addEventListener("pointerup",finish);grip.addEventListener("pointercancel",finish)
 })
}
search.addEventListener("input",render);(async()=>{await hydrateImages();render()})();
</script>
