:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);padding:14px 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:24px;margin:0 0 10px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.search{width:100%;border:0;background:#eef0f3;border-radius:12px;padding:11px 13px;font-size:16px;outline:none}
.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0 2px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:600}.tab.active{background:#111827;color:white;border-color:#111827}
main{max-width:760px;margin:auto;padding:10px 10px 90px}.row{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:7px 0;padding:10px 9px;touch-action:none}
.rank{width:35px;text-align:center;font-weight:800;color:#6b7280}.flag{font-size:25px;width:34px;text-align:center}.name{flex:1;min-width:0}.name b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:2px}.badge{font-size:10px;font-weight:800;border-radius:7px;padding:5px 6px;background:#eef0f3}.points{min-width:76px;text-align:right;font-weight:900;font-size:15px}.points small{display:block;font-size:10px;margin-top:3px}.points .pos{color:#16a34a}.points .neg{color:#dc2626}.points .zero{color:#9ca3af}.edit{display:none}.flag img{width:30px;height:30px;object-fit:cover;border-radius:50%;display:block}.confLogo{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:5px}.grip{border:0;background:#eef0f3;color:#6b7280;border-radius:9px;width:38px;height:38px;font-size:20px;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;flex:0 0 38px}.row.dragging{opacity:.7;box-shadow:0 10px 28px #0003}.row.drag{opacity:.45}.row.over{outline:2px solid #111827}
.trend{width:28px;text-align:center;font-size:13px;font-weight:900;flex:0 0 28px}.trend.up{color:#16a34a}.trend.down{color:#dc2626}.trend.same{color:#9ca3af}.yearbar{display:flex;gap:7px;overflow:auto;padding:8px 0 0;scrollbar-width:none}.yearbar::-webkit-scrollbar{display:none}.yearbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-weight:700;white-space:nowrap}.yearbtn.active{background:#111827;color:#fff}.settingsBtn{border:0;background:#eef0f3;border-radius:10px;padding:8px 10px;font-weight:700;margin-top:8px}.logoRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.logoPreview{width:38px;height:38px;object-fit:contain;border-radius:8px;background:#f3f4f6}.fileBtn{display:inline-block;background:#eef0f3;border-radius:10px;padding:10px 12px;font-weight:700}.actions{position:fixed;bottom:16px;right:16px;z-index:10;display:flex;gap:8px}.fab{border:0;border-radius:999px;background:#111827;color:#fff;padding:13px 16px;font-weight:800;box-shadow:0 8px 25px #0003}.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:20}.sheet{background:white;width:100%;border-radius:22px 22px 0 0;padding:20px;max-height:85vh;overflow:auto}.sheet h2{margin-top:0}.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:16px;margin:6px 0 12px}.sheet button{border:0;border-radius:11px;padding:12px 15px;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#eef0f3}.confgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.conf{padding:14px;border:1px solid var(--line);border-radius:14px;background:white;text-align:left}.conf strong{display:block}.conf small{color:var(--muted)}.movebox{display:flex;gap:8px;margin:2px 0 14px}.movebox button{flex:1;background:#eef0f3}.danger{background:#fee2e2;color:#991b1b;margin-left:auto}
</style>

<body>
<header>
<h1>⚽ Meine Weltrangliste</h1>
<div class="sub"><span id="count"></span> Mannschaften · Rangfolge nach Punkten</div>
<input id="search" class="search" placeholder="🔎 Land suchen …">
<div class="yearbar" id="yearbar"></div>
<div class="tabs" id="tabs"></div>
<div style="display:flex;gap:7px">
<button class="settingsBtn" onclick="saveSnapshot()">💾 Jahr speichern</button>
<button class="settingsBtn" onclick="openConfSettings()">⚙️ Verbände</button>
</div>
</header>
<main id="list"></main>
<div class="actions"><button class="fab" onclick="openAdd()">＋ Mannschaft</button></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">
<h2 id="modalTitle">Mannschaft hinzufügen</h2>
<label>Name</label><input id="mName" placeholder="z. B. Deutschland">
<label>FIFA-/Kurzcode</label><input id="mCode" placeholder="GER"><input id="mRank" type="hidden">
<label>Punkte</label><input id="mPoints" type="number" step="0.01" inputmode="decimal" placeholder="z. B. 1854.32">
<label>Verband</label><select id="mConf"></select>
<label>Flagge (Emoji)</label><input id="mFlag" placeholder="🇩🇪">
<label>oder Flaggenbild</label>
<input id="mFlagFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
<div id="flagImageInfo" class="sub"></div>
<div id="movebox" class="movebox" style="display:none">
<button onclick="moveEdited(-1)">▲ 1 Platz</button><button onclick="moveEdited(1)">▼ 1 Platz</button>
</div>
<div style="display:flex;gap:8px"><button class="primary" onclick="saveTeam()">Speichern</button><button class="secondary" onclick="closeModal()">Abbrechen</button><button id="deleteBtn" class="danger" style="display:none" onclick="deleteEdited()">Löschen</button></div>
</div></div>

<div id="confModal" class="modal" onclick="if(event.target===this)closeConfSettings()"><div class="sheet">
<h2>Verbände bearbeiten</h2>
<div class="sub">Hier kannst du Namen und Logos der Verbände ändern. Die Bilder werden nur auf diesem Gerät gespeichert.</div>
<div id="confLogoList"></div>
<div style="margin-top:14px"><button class="secondary" onclick="closeConfSettings()">Fertig</button></div>
</div></div>

function previousSnapshot(){
 let ys=sortedYears().filter(y=>!viewingYear || Number(y)<Number(viewingYear));
 if(!viewingYear)return ys[0]?snapshots[ys[0]]:null;
 return ys[0]?snapshots[ys[0]]:null
}
function trendFor(t,world){
 let prev=previousSnapshot(); if(!prev)return "";
 let i=prev.teams.findIndex(x=>x.id===t.id || (x.code===t.code&&x.name===t.name)); if(i<0)return "";
 let old=i+1, d=old-world;
 return d>0?`<div class="trend up" title="+${d}">▲${d}</div>`:d<0?`<div class="trend down" title="${d}">▼${Math.abs(d)}</div>`:`<div class="trend same">●</div>`
}

}

function pointChange(t){let old=previousPoints(t);if(old===null)return "";let d=pointsOf(t)-old, cls=d>0?"pos":d<0?"neg":"zero", sign=d>0?"+":"";return `<small class="${cls}">${sign}${d.toFixed(2)}</small>`}

 if(editId){let i=teams.findIndex(x=>x.id===editId);if(i>=0)teams[i]={...teams[i],name,code,conf:mConf.value,flag}}
 else teams.push({id:code+"-"+Date.now(),name,code,conf:mConf.value,flag});
 let wanted=Math.max(1,Math.min(teams.length,parseInt(mRank.value)||teams.length));
 let targetIdForRank=editId || teams[teams.length-1].id;
 let ri=teams.findIndex(x=>x.id===targetIdForRank);
 if(ri>=0){let [it]=teams.splice(ri,1);teams.splice(wanted-1,0,it)}

}

 if(!editId)return;let t=teams.find(x=>x.id===editId);
 if(!confirm(`"${t?.name||"Mannschaft"}" wirklich löschen?`))return;
 delImage("team:"+editId);teams=teams.filter(x=>x.id!==editId);save();closeModal();render()
}
function moveEdited(dir){
 if(!editId)return;let i=teams.findIndex(x=>x.id===editId),j=i+dir;if(i<0||j<0||j>=teams.length)return;
 [teams[i],teams[j]]=[teams[j],teams[i]];save();render()
}

function openConfSettings(){
 const items=confs.filter(x=>!["ALL","CUSTOM"].includes(x[0]));
 confLogoList.innerHTML=items.map(c=>`<div class="logoRow"><div><strong>${c[0]}</strong><input id="cn-${c[0]}" value="${esc(labelForTab(c))}" onchange="setConfName('${c[0]}',this.value)" style="margin:6px 0 0"><div class="sub">${c[2]}</div></div><div><img id="prev-${c[0]}" class="logoPreview" ${confImages[c[0]]?`src="${confImages[c[0]]}"`:""}><label class="fileBtn">Bild wählen<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none" onchange="setConfLogo('${c[0]}',this)"></label></div></div>`).join("");
 confModal.style.display="flex"
}
function setConfName(conf,val){confLabels[conf]=val.trim()||conf;localStorage.setItem("rankingConfLabels",JSON.stringify(confLabels));render()}
async function setConfLogo(conf,input){
 if(!input.files[0])return;
 await putImage("conf:"+conf,input.files[0]);await hydrateImages();render();openConfSettings()
}
function closeConfSettings(){confModal.style.display="none"}
function closeModal(){modal.style.display="none";editId=null}
function moveTeam(dragId,targetId,after){
 let from=teams.findIndex(x=>x.id===dragId);if(from<0)return;
 let [item]=teams.splice(from,1),to=teams.findIndex(x=>x.id===targetId);
 if(to<0){teams.splice(from,0,item);return}if(after)to++;teams.splice(to,0,item);save()
}
function attachGripHandlers(){
 if(viewingYear)return;
 document.querySelectorAll(".grip").forEach(grip=>{
   grip.addEventListener("pointerdown",e=>{
     e.preventDefault();let row=grip.closest(".row");
     dragState={id:grip.dataset.grip,pointerId:e.pointerId,row,last:""};grip.setPointerCapture?.(e.pointerId);row.classList.add("dragging")
   });
   grip.addEventListener("pointermove",e=>{
     if(!dragState||dragState.pointerId!==e.pointerId)return;e.preventDefault();
     let el=document.elementFromPoint(e.clientX,e.clientY),target=el?.closest?.(".row");
     if(!target||target.dataset.id===dragState.id)return;
     let r=target.getBoundingClientRect(),after=e.clientY>r.top+r.height/2,key=target.dataset.id+":"+after;
     if(key===dragState.last)return;dragState.last=key;
     moveTeam(dragState.id,target.dataset.id,after);render();
     let ng=[...document.querySelectorAll(".grip")].find(x=>x.dataset.grip===dragState.id);
     if(ng){dragState.row=ng.closest(".row");dragState.row.classList.add("dragging")}
   });
   let finish=()=>{if(dragState){dragState.row?.classList.remove("dragging");dragState=null;render()}};
   grip.addEventListener("pointerup",finish);grip.addEventListener("pointercancel",finish)
 })
}
search.addEventListener("input",render);(async()=>{await hydrateImages();render()})();
</script>
